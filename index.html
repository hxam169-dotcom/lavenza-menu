<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAVENZA Menu</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #f6efe3;
  overflow: hidden;
}

.page {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  display: none;
}

.page.active {
  display: block;
}

.buttons {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

button {
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  background: #3b2923;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<img src="1.jpg" class="page active">
<img src="2.jpg" class="page">
<img src="3.jpg" class="page">
<img src="4.jpg" class="page">
<img src="5.jpg" class="page">
<img src="6.jpg" class="page">
<img src="7.jpg" class="page">
<img src="8.jpg" class="page">
<img src="9.jpg" class="page">

<div class="buttons">
  <button onclick="previousPage()">← Previous</button>
  <button onclick="nextPage()">Next →</button>
</div>

<script>
let currentPage = 0;
const pages = document.querySelectorAll(".page");

function showPage(number) {
  pages[currentPage].classList.remove("active");
  currentPage = (number + pages.length) % pages.length;
  pages[currentPage].classList.add("active");
}

function nextPage() {
  showPage(currentPage + 1);
}

function previousPage() {
  showPage(currentPage - 1);
}
</script>

</body>
</html>
