<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAVENZA — Italian Restaurant & Café</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f6efe3;
}


/* =========================
   PAGES
========================= */

.page {
  position: absolute;
  inset: 0;

  width: 100vw;
  height: 100vh;

  object-fit: contain;

  opacity: 0;
  transform: scale(0.985);

  pointer-events: none;

  transition:
    opacity 0.55s ease,
    transform 0.65s ease;
}

.page.active {
  opacity: 1;
  transform: scale(1);

  pointer-events: auto;
}


/* =========================
   NAVIGATION
========================= */

.navigation {

  position: fixed;

  bottom: 18px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;
  gap: 14px;

  z-index: 50;
}


.arrow {

  width: 42px;
  height: 42px;

  border: 1px solid #b69a62;
  border-radius: 50%;

  background: rgba(246, 239, 227, 0.92);

  color: #3b2923;

  font-size: 22px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: 0.25s ease;
}


.arrow:hover {
  transform: scale(1.08);
}


.arrow:active {
  transform: scale(0.94);
}


.arrow.hidden {
  display: none;
}


/* =========================
   HOME BUTTON
========================= */

.home-button {

  position: fixed;

  top: 20px;
  left: 20px;

  z-index: 60;

  padding: 10px 17px;

  border: 1px solid #b69a62;
  border-radius: 30px;

  background: rgba(246, 239, 227, 0.94);

  color: #3b2923;

  font-family: Georgia, serif;

  font-size: 13px;

  letter-spacing: 0.5px;

  cursor: pointer;

  opacity: 0;

  pointer-events: none;

  transform: translateY(-8px);

  transition:
    opacity 0.35s ease,
    transform 0.35s ease;
}


.home-button.visible {

  opacity: 1;

  pointer-events: auto;

  transform: translateY(0);
}


.home-button:hover {

  background: #fffaf2;

  transform: translateY(-2px);
}


/* =========================
   BACK TO MENU
========================= */

.menu-button {

  position: fixed;

  top: 20px;
  right: 20px;

  z-index: 60;

  padding: 10px 17px;

  border: 1px solid #b69a62;
  border-radius: 30px;

  background: rgba(246, 239, 227, 0.94);

  color: #3b2923;

  font-family: Georgia, serif;

  font-size: 13px;

  letter-spacing: 0.5px;

  cursor: pointer;

  opacity: 0;

  pointer-events: none;

  transform: translateY(-8px);

  transition:
    opacity 0.35s ease,
    transform 0.35s ease;
}


.menu-button.visible {

  opacity: 1;

  pointer-events: auto;

  transform: translateY(0);
}


.menu-button:hover {

  background: #fffaf2;

  transform: translateY(-2px);
}


/* =========================
   INVISIBLE MENU AREAS
========================= */

.menu-area {

  position: fixed;

  z-index: 40;

  cursor: pointer;

  background: transparent;

  border: none;
}


/*
   PAGE 1
   Explore Our Menu
*/

.explore-area {

  left: 25%;
  top: 65%;

  width: 50%;
  height: 15%;
}


/*
   PAGE 2
   MENU CATEGORIES

   Layout:

   RIGHT        LEFT

   Main         Soups
   Starters     Drinks
   Sides        Desserts
*/


/* Main Dishes — top right */

.main-dishes-area {

  right: 50%;
  top: 15%;

  width: 50%;
  height: 28%;
}


/* Soups — top left */

.soups-area {

  left: 50%;
  top: 15%;

  width: 50%;
  height: 28%;
}


/* Starters — middle right */

.starters-area {

  right: 50%;
  top: 43%;

  width: 50%;
  height: 28%;
}


/* Drinks — middle left */

.drinks-area {

  left: 50%;
  top: 43%;

  width: 50%;
  height: 28%;
}


/* Sides — bottom right */

.sides-area {

  right: 50%;
  top: 71%;

  width: 50%;
  height: 28%;
}


/* Desserts — bottom left */

.desserts-area {

  left: 50%;
  top: 71%;

  width: 50%;
  height: 28%;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .arrow {

    width: 38px;
    height: 38px;

    font-size: 19px;
  }


  .navigation {

    bottom: 14px;
    gap: 10px;
  }


  .home-button,
  .menu-button {

    top: 14px;

    padding: 8px 14px;

    font-size: 12px;
  }

}

</style>

</head>


<body>


<!-- =========================
     PAGES
========================= -->

<img src="1.jpg" class="page active">

<img src="2.jpg" class="page">

<img src="3.jpg" class="page">

<img src="4.jpg" class="page">

<img src="5.jpg" class="page">

<img src="6.jpg" class="page">

<img src="7.jpg" class="page">

<img src="8.jpg" class="page">

<img src="9.jpg" class="page">


<!-- =========================
     EXPLORE MENU
========================= -->

<button
  class="menu-area explore-area"
  onclick="goToPage(1)">
</button>


<!-- =========================
     CATEGORY BUTTONS
========================= -->


<!-- Main Dishes -->

<button
  class="menu-area main-dishes-area"
  onclick="goToPage(2)">
</button>


<!-- Soups -->

<button
  class="menu-area soups-area"
  onclick="goToPage(3)">
</button>


<!-- Starters -->

<button
  class="menu-area starters-area"
  onclick="goToPage(4)">
</button>


<!-- Drinks -->

<button
  class="menu-area drinks-area"
  onclick="goToPage(5)">
</button>


<!-- Sides -->

<button
  class="menu-area sides-area"
  onclick="goToPage(6)">
</button>


<!-- Desserts -->

<button
  class="menu-area desserts-area"
  onclick="goToPage(7)">
</button>


<!-- =========================
     HOME BUTTON
========================= -->

<button
  id="homeButton"
  class="home-button"
  onclick="goHome()">

  ← Home

</button>


<!-- =========================
     BACK TO MENU
========================= -->

<button
  id="menuButton"
  class="menu-button"
  onclick="goToMenu()">

  ← Back to Menu

</button>


<!-- =========================
     NAVIGATION ARROWS
========================= -->

<div class="navigation">

  <button
    id="previous"
    class="arrow"
    onclick="previousPage()">

    ←

  </button>


  <button
    id="next"
    class="arrow"
    onclick="nextPage()">

    →

  </button>

</div>


<script>


/* =========================
   VARIABLES
========================= */

let currentPage = 0;


const pages =
  document.querySelectorAll(".page");


const previousButton =
  document.getElementById("previous");


const nextButton =
  document.getElementById("next");


const homeButton =
  document.getElementById("homeButton");


const menuButton =
  document.getElementById("menuButton");


/* =========================
   UPDATE PAGE
========================= */

function updatePage() {


  pages.forEach(page => {

    page.classList.remove("active");

  });


  pages[currentPage].classList.add("active");


  /* HOME */

  if (currentPage === 0) {

    homeButton.classList.remove("visible");

  } else {

    homeButton.classList.add("visible");

  }


  /* BACK TO MENU */

  if (
    currentPage >= 2 &&
    currentPage <= 8
  ) {

    menuButton.classList.add("visible");

  } else {

    menuButton.classList.remove("visible");

  }


  /* PREVIOUS */

  if (currentPage === 0) {

    previousButton.classList.add("hidden");

  } else {

    previousButton.classList.remove("hidden");

  }


  /* NEXT */

  if (
    currentPage === pages.length - 1
  ) {

    nextButton.classList.add("hidden");

  } else {

    nextButton.classList.remove("hidden");

  }

}


/* =========================
   GO TO SPECIFIC PAGE
========================= */

function goToPage(pageNumber) {

  if (
    pageNumber >= 0 &&
    pageNumber < pages.length
  ) {

    currentPage = pageNumber;

    updatePage();

  }

}


/* =========================
   NEXT
========================= */

function nextPage() {

  if (
    currentPage <
    pages.length - 1
  ) {

    currentPage++;

    updatePage();

  }

}


/* =========================
   PREVIOUS
========================= */

function previousPage() {

  if (currentPage > 0) {

    currentPage--;

    updatePage();

  }

}


/* =========================
   HOME
========================= */

function goHome() {

  currentPage = 0;

  updatePage();

}


/* =========================
   BACK TO MENU
========================= */

function goToMenu() {

  currentPage = 1;

  updatePage();

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "ArrowRight") {

      nextPage();

    }


    if (event.key === "ArrowLeft") {

      previousPage();

    }

  }
);


/* =========================
   INITIAL
========================= */

updatePage();

</script>

</body>
</html>
