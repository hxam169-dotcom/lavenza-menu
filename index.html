<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAVENZA — Italian Restaurant & Café</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f6efe3;
}

.page {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  display: none;
}

.page.active {
  display: block;
}

/* Navigation arrows */
.navigation {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 14px;
  z-index: 20;
}

.arrow {
  width: 42px;
  height: 42px;
  border: 1px solid #b69a62;
  border-radius: 50%;
  background: rgba(246, 239, 227, 0.92);
  color: #3b2923;
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}

.arrow:hover {
  transform: scale(1.08);
}

.arrow.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- Pages -->

<img src="1.jpg" class="page active">
<img src="2.jpg" class="page">
<img src="3.jpg" class="page">
<img src="4.jpg" class="page">
<img src="5.jpg" class="page">
<img src="6.jpg" class="page">
<img src="7.jpg" class="page">
<img src="8.jpg" class="page">
<img src="9.jpg" class="page">


<!-- Navigation -->

<div class="navigation">

  <button id="previous" class="arrow" onclick="previousPage()">
    ←
  </button>

  <button id="next" class="arrow" onclick="nextPage()">
    →
  </button>

</div>


<script>

let currentPage = 0;

const pages = document.querySelectorAll(".page");

const previousButton = document.getElementById("previous");
const nextButton = document.getElementById("next");


function updatePage() {

  pages.forEach(page => {
    page.classList.remove("active");
  });

  pages[currentPage].classList.add("active");


  /* آخر صفحة: سهم الرجوع فقط */

  if (currentPage === 8) {

    previousButton.classList.remove("hidden");
    nextButton.classList.add("hidden");

  } else {

    previousButton.classList.remove("hidden");
    nextButton.classList.remove("hidden");

  }

}


/* الصفحة التالية */

function nextPage() {

  if (currentPage < pages.length - 1) {

    currentPage++;

    updatePage();

  }

}


/* الصفحة السابقة */

function previousPage() {

  if (currentPage > 0) {

    currentPage--;

    updatePage();

  }

}

</script>

</body>
</html>
