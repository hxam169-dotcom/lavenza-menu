<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAVENZA — Italian Restaurant & Café</title>


<style>

/* =========================
   RESET
========================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #f6efe3;

}


/* =========================
   PAGES
========================= */

.page {

  position: absolute;

  inset: 0;

  width: 100vw;
  height: 100vh;

  object-fit: contain;

  opacity: 0;

  transform: scale(0.985);

  pointer-events: none;

  transition:
    opacity 0.55s ease,
    transform 0.65s ease;

}


.page.active {

  opacity: 1;

  transform: scale(1);

  pointer-events: auto;

}


/* =========================
   NAVIGATION
========================= */

.navigation {

  position: fixed;

  bottom: 18px;

  left: 50%;

  transform: translateX(-50%);

  display: flex;

  gap: 14px;

  z-index: 50;

}


.arrow {

  width: 42px;
  height: 42px;

  border: 1px solid #b69a62;

  border-radius: 50%;

  background: rgba(246, 239, 227, 0.92);

  color: #3b2923;

  font-size: 22px;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  transition: 0.25s ease;

}


.arrow:hover {

  transform: scale(1.08);

}


.arrow:active {

  transform: scale(0.94);

}


.arrow.hidden {

  display: none;

}


/* =========================
   HOME BUTTON
========================= */

.home-button {

  position: fixed;

  top: 20px;

  left: 20px;

  z-index: 60;

  padding: 10px 17px;

  border: 1px solid #b69a62;

  border-radius: 30px;

  background: rgba(246, 239, 227, 0.94);

  color: #3b2923;

  font-family: Georgia, serif;

  font-size: 13px;

  letter-spacing: 0.5px;

  cursor: pointer;

  opacity: 0;

  pointer-events: none;

  transform: translateY(-8px);

  transition:
    opacity 0.35s ease,
    transform 0.35s ease;

}


.home-button.visible {

  opacity: 1;

  pointer-events: auto;

  transform: translateY(0);

}


.home-button:hover {

  background: #fffaf2;

  transform: translateY(-2px);

}


/* =========================
   BACK TO MENU
========================= */

.menu-button {

  position: fixed;

  top: 20px;

  right: 20px;

  z-index: 60;

  padding: 10px 17px;

  border: 1px solid #b69a62;

  border-radius: 30px;

  background: rgba(246, 239, 227, 0.94);

  color: #3b2923;

  font-family: Georgia, serif;

  font-size: 13px;

  letter-spacing: 0.5px;

  cursor: pointer;

  opacity: 0;

  pointer-events: none;

  transform: translateY(-8px);

  transition:
    opacity 0.35s ease,
    transform 0.35s ease;

}


.menu-button.visible {

  opacity: 1;

  pointer-events: auto;

  transform: translateY(0);

}


.menu-button:hover {

  background: #fffaf2;

  transform: translateY(-2px);

}


/* =========================
   INVISIBLE CLICK AREAS
========================= */

.menu-area {

  position: fixed;

  z-index: 40;

  cursor: pointer;

  background: transparent;

  border: none;

  outline: none;

}


/* =========================
   PAGE 1
   EXPLORE OUR MENU
========================= */

.explore-area {

  left: 50%;

  top: 72%;

  width: 220px;

  height: 55px;

  transform: translateX(-50%);

}


/* =========================
   PAGE 2
   CATEGORY AREAS
========================= */

/*

   ┌──────────────┬──────────────┐
   │    SOUPS     │ MAIN DISHES  │
   ├──────────────┼──────────────┤
   │    DRINKS    │   STARTERS   │
   ├──────────────┼──────────────┤
   │   DESSERTS   │    SIDES     │
   └──────────────┴──────────────┘

*/
/* Main Dishes — أعلى اليمين */
.main-dishes-area {
  left: 52%;
  top: 24%;
  width: 20%;
  height: 15%;
}

/* Soups — أعلى اليسار */
.soups-area {
  left: 28%;
  top: 24%;
  width: 20%;
  height: 15%;
}

/* Starters — الوسط اليمين */
.starters-area {
  left: 52%;
  top: 42%;
  width: 20%;
  height: 15%;
}

/* Drinks — الوسط اليسار */
.drinks-area {
  left: 28%;
  top: 42%;
  width: 20%;
  height: 15%;
}

/* Sides — أسفل اليمين */
.sides-area {
  left: 52%;
  top: 65%;
  width: 20%;
  height: 15%;
}

/* Desserts — أسفل اليسار */
.desserts-area {
  left: 28%;
  top: 65%;
  width: 20%;
  height: 15%;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {


  .arrow {

    width: 38px;

    height: 38px;

    font-size: 19px;

  }


  .navigation {

    bottom: 14px;

    gap: 10px;

  }


  .home-button,
  .menu-button {

    top: 14px;

    padding: 8px 14px;

    font-size: 12px;

  }


  .explore-area {

    width: 180px;

    height: 48px;

  }

}


</style>

</head>


<body>


<!-- =========================
     MENU PAGES
========================= -->

<img src="1.jpg" class="page active">

<img src="2.jpg" class="page">

<img src="3.jpg" class="page">

<img src="4.jpg" class="page">

<img src="5.jpg" class="page">

<img src="6.jpg" class="page">

<img src="7.jpg" class="page">

<img src="8.jpg" class="page">

<img src="9.jpg" class="page">


<!-- =========================
     EXPLORE OUR MENU
========================= -->

<button
  class="menu-area explore-area"
  onclick="goToPage(1)"
  aria-label="Explore Our Menu">
</button>


<!-- =========================
     CATEGORY BUTTONS
========================= -->


<!-- MAIN DISHES -->

<button
  class="menu-area main-dishes-area"
  onclick="goToPage(2)"
  aria-label="Main Dishes">
</button>


<!-- SOUPS -->

<button
  class="menu-area soups-area"
  onclick="goToPage(3)"
  aria-label="Soups">
</button>


<!-- STARTERS -->

<button
  class="menu-area starters-area"
  onclick="goToPage(4)"
  aria-label="Starters">
</button>


<!-- DRINKS -->

<button
  class="menu-area drinks-area"
  onclick="goToPage(5)"
  aria-label="Drinks">
</button>


<!-- SIDES -->

<button
  class="menu-area sides-area"
  onclick="goToPage(6)"
  aria-label="Sides">
</button>


<!-- DESSERTS -->

<button
  class="menu-area desserts-area"
  onclick="goToPage(7)"
  aria-label="Desserts">
</button>


<!-- =========================
     HOME
========================= -->

<button
  id="homeButton"
  class="home-button"
  onclick="goHome()">

  ← Home

</button>


<!-- =========================
     BACK TO MENU
========================= -->

<button
  id="menuButton"
  class="menu-button"
  onclick="goToMenu()">

  ← Back to Menu

</button>


<!-- =========================
     ARROWS
========================= -->

<div class="navigation">


  <button
    id="previous"
    class="arrow"
    onclick="previousPage()">

    ←

  </button>


  <button
    id="next"
    class="arrow"
    onclick="nextPage()">

    →

  </button>


</div>


<script>


/* =========================
   VARIABLES
========================= */

let currentPage = 0;


const pages =
  document.querySelectorAll(".page");


const previousButton =
  document.getElementById("previous");


const nextButton =
  document.getElementById("next");


const homeButton =
  document.getElementById("homeButton");


const menuButton =
  document.getElementById("menuButton");


/* =========================
   UPDATE PAGE
========================= */

function updatePage() {


  pages.forEach(function(page) {

    page.classList.remove("active");

  });


  pages[currentPage]
    .classList.add("active");


  /* =====================
     HOME BUTTON
  ===================== */

  if (currentPage === 0) {

    homeButton
      .classList
      .remove("visible");

  }

  else {

    homeButton
      .classList
      .add("visible");

  }


  /* =====================
     BACK TO MENU
  ===================== */

  if (
    currentPage >= 2 &&
    currentPage <= 8
  ) {

    menuButton
      .classList
      .add("visible");

  }

  else {

    menuButton
      .classList
      .remove("visible");

  }


  /* =====================
     PREVIOUS ARROW
  ===================== */

  if (currentPage === 0) {

    previousButton
      .classList
      .add("hidden");

  }

  else {

    previousButton
      .classList
      .remove("hidden");

  }


  /* =====================
     NEXT ARROW
  ===================== */

  if (
    currentPage ===
    pages.length - 1
  ) {

    nextButton
      .classList
      .add("hidden");

  }

  else {

    nextButton
      .classList
      .remove("hidden");

  }

}


/* =========================
   GO TO PAGE
========================= */

function goToPage(pageNumber) {


  if (
    pageNumber >= 0 &&
    pageNumber < pages.length
  ) {

    currentPage = pageNumber;

    updatePage();

  }

}


/* =========================
   NEXT PAGE
========================= */

function nextPage() {


  if (
    currentPage <
    pages.length - 1
  ) {

    currentPage++;

    updatePage();

  }

}


/* =========================
   PREVIOUS PAGE
========================= */

function previousPage() {


  if (currentPage > 0) {

    currentPage--;

    updatePage();

  }

}


/* =========================
   HOME
========================= */

function goHome() {

  currentPage = 0;

  updatePage();

}


/* =========================
   BACK TO MENU
========================= */

function goToMenu() {

  currentPage = 1;

  updatePage();

}


/* =========================
   KEYBOARD NAVIGATION
========================= */

document.addEventListener(
  "keydown",
  function(event) {


    if (event.key === "ArrowRight") {

      nextPage();

    }


    if (event.key === "ArrowLeft") {

      previousPage();

    }

  }
);


/* =========================
   INITIAL PAGE
========================= */

updatePage();


</script>


</body>

</html>
